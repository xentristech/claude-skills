<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control — Xentris Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Paleta oficial del brandbook Xentris ===== */
  :root{
    --bg:#0d0d0d;            /* navy-950 (OLED) */
    --surface:#15112a;       /* carta */
    --surface-2:#1b123f;     /* navy-900 elevado */
    --surface-3:#241a4a;     /* hover */
    --border:#2e2450;
    --border-strong:#3d2f6b;
    --brand:#8b3bc0;         /* morado principal */
    --brand-2:#a866d8;
    --lila:#c9a3ec;          /* acento */
    --text:#f8f7fb;          /* ink-50 */
    --muted:#9187a9;         /* ink-400 */
    --faint:#6b6080;         /* ink-500 */
    --green:#22c55e;
    --amber:#fbbf24;
    --red:#ef4444;
    --gray:#6b6080;
    --radius:14px;
    --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{color-scheme:dark;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Montserrat',ui-sans-serif,system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Code',Consolas,monospace;}
  .tnum{font-variant-numeric:tabular-nums;}

  /* ícono base */
  .ic{width:1em;height:1em;stroke:currentColor;stroke-width:1.9;fill:none;
    stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.14em;}

  a,button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:6px;}

  /* ===== Header ===== */
  header{
    display:flex;align-items:center;gap:18px;
    padding:16px 26px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#1b123f 0%,#0d0d0d 100%);
    position:sticky;top:0;z-index:10;
  }
  .brandmark{display:flex;align-items:center;gap:13px;min-width:0;}
  .brandmark img{height:30px;width:auto;display:block;}
  .brandmark .sep{width:1px;height:30px;background:var(--border-strong);}
  .title h1{font-size:16px;font-weight:700;letter-spacing:.2px;line-height:1.1;}
  .title p{font-size:12px;color:var(--muted);margin-top:2px;}
  .spacer{flex:1;}

  .stats{display:flex;gap:10px;margin-right:6px;}
  .stat{
    text-align:center;background:var(--surface);border:1px solid var(--border);
    border-radius:11px;padding:7px 15px;min-width:74px;
  }
  .stat b{font-size:19px;display:block;line-height:1.1;}
  .stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;}
  .stat.working b{color:var(--green);}
  .stat.waiting b{color:var(--amber);}

  .toggle{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);
    padding:10px 16px;border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:500;
    transition:background .18s ease,border-color .18s ease;
  }
  .toggle:hover{background:var(--surface-3);border-color:var(--brand);}
  .toggle.on{background:var(--brand);border-color:var(--brand);font-weight:600;}
  .toggle .ic{font-size:17px;}

  /* ===== Grid ===== */
  .grid{
    display:grid;gap:16px;padding:22px 26px;
    grid-template-columns:repeat(auto-fill,minmax(350px,1fr));
  }
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;display:flex;flex-direction:column;gap:12px;
    transition:border-color .25s ease,transform .12s ease;
  }
  .card.working{border-color:rgba(34,197,94,.45);box-shadow:0 0 0 1px rgba(34,197,94,.08),var(--shadow);}
  .card.waiting{border-color:rgba(251,191,36,.42);}
  .card.paused{border-color:rgba(239,68,68,.4);}

  /* ===== Tarjeta clicable: abre la ventana de ese agente ===== */
  .card{cursor:pointer;position:relative;}
  .card:hover,.card:focus-visible{border-color:var(--brand-2);transform:translateY(-2px);}
  .card:focus-visible{outline:2px solid var(--brand-2);outline-offset:3px;}
  .abrir{
    display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:2px;
    font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);
    opacity:0;transition:opacity .2s ease,color .2s ease;
  }
  .card:hover .abrir,.card:focus-visible .abrir{opacity:1;color:var(--lila);}
  @media (hover:none){ .abrir{opacity:1;} }         /* en tactil no hay hover */
  /* En modo presentacion la tarjeta es de solo lectura: nada de abrir
     terminales delante de un cliente. */
  body.presenta .card{cursor:default;transform:none;}
  body.presenta .abrir{display:none;}

  /* ===== Aviso flotante ===== */
  #aviso{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
    max-width:min(560px,92vw);padding:13px 18px;border-radius:var(--radius);
    background:var(--surface-2);border:1px solid var(--border-strong);
    box-shadow:var(--shadow);color:var(--text);font-size:13.5px;line-height:1.45;
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:50;
  }
  #aviso.ver{opacity:1;transform:translate(-50%,0);}
  #aviso.mal{border-color:rgba(239,68,68,.55);}

  .card-head{display:flex;align-items:center;gap:11px;}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;}
  .working .dot{background:var(--green);box-shadow:0 0 0 0 rgba(34,197,94,.55);}
  .waiting .dot{background:var(--amber);}
  .paused  .dot{background:var(--red);}
  .idle    .dot{background:var(--gray);}
  @media (prefers-reduced-motion: no-preference){
    .working .dot{animation:pulse 1.7s infinite;}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.55);}50%{box-shadow:0 0 0 7px rgba(34,197,94,0);}}
  }
  /* Ahora el titular es el nombre de la conversación (el mismo que lleva la
     ventana), que puede ser largo: se acota a dos líneas para no descuadrar. */
  .proj{
    font-weight:700;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .slug{color:var(--muted);font-size:11.5px;display:flex;align-items:center;gap:6px;margin-top:2px;}

  /* ===== Nombre del proyecto + pastilla de resumen al pasar el mouse ===== */
  .proyecto{
    display:inline-flex;align-items:center;gap:5px;position:relative;
    border-radius:5px;padding:1px 3px;margin:-1px -3px;
  }
  .proyecto[data-resumen]{cursor:help;text-decoration:underline dotted var(--faint);text-underline-offset:3px;}
  .proyecto[data-resumen]:hover,.proyecto[data-resumen]:focus-visible{color:var(--lila);}
  .pastilla{
    position:absolute;top:calc(100% + 9px);left:-4px;z-index:40;
    width:max-content;max-width:min(330px,72vw);
    background:var(--surface-2);border:1px solid var(--border-strong);
    border-radius:11px;padding:11px 13px;box-shadow:var(--shadow);
    color:var(--text);font-size:12.5px;line-height:1.5;text-align:left;
    opacity:0;visibility:hidden;transform:translateY(-4px);
    transition:opacity .16s ease,transform .16s ease,visibility .16s;
    pointer-events:none;white-space:normal;
  }
  .proyecto:hover .pastilla,.proyecto:focus-visible .pastilla{opacity:1;visibility:visible;transform:translateY(0);}
  .pastilla .p-et{
    display:block;font-size:9.5px;font-weight:700;letter-spacing:2px;
    text-transform:uppercase;color:var(--lila);margin-bottom:5px;
  }
  .pastilla .p-fuente{
    display:block;margin-top:8px;padding-top:7px;border-top:1px solid var(--border);
    color:var(--faint);font-size:10.5px;
  }
  /* La tarjeta apuntada va por encima de sus hermanas, o la pastilla queda debajo. */
  .card:hover,.card:focus-within{z-index:20;}

  /* ===== Artefactos publicados por la sesión ===== */
  .artefactos{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;max-width:100%;
    padding:5px 11px;border-radius:99px;border:1px solid var(--border-strong);
    background:rgba(139,59,192,.1);color:var(--lila);
    font-size:11.5px;font-weight:700;text-decoration:none;
    transition:border-color .18s ease,background .18s ease;
  }
  .chip:hover{border-color:var(--brand-2);background:rgba(139,59,192,.2);}
  .chip .emo{font-size:12.5px;line-height:1;}
  .chip .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px;font-weight:500;}
  .chip svg{width:12px;height:12px;flex:none;}
  .slug .ic{font-size:13px;}
  .badge{
    margin-left:auto;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;
    background:var(--surface-2);color:var(--muted);white-space:nowrap;
  }
  .working .badge{color:var(--green);background:rgba(34,197,94,.12);}
  .waiting .badge{color:var(--amber);background:rgba(251,191,36,.12);}
  .paused  .badge{color:var(--red);background:rgba(239,68,68,.12);}

  .now{background:var(--surface-2);border-radius:11px;padding:11px 13px;font-size:13.5px;line-height:1.45;}
  .now .label{display:flex;align-items:center;gap:6px;font-size:10px;text-transform:uppercase;
    letter-spacing:1.1px;color:var(--lila);margin-bottom:5px;font-weight:600;}
  .now .label .ic{font-size:13px;}

  .prompt{font-size:12.5px;color:var(--muted);line-height:1.45;}
  .prompt b{color:var(--text);font-weight:600;}

  .timeline{display:flex;flex-direction:column;gap:5px;}
  .tl-item{display:flex;gap:9px;font-size:12.5px;color:var(--muted);align-items:baseline;}
  .tl-item .t{color:var(--muted);font-size:11px;min-width:44px;}
  .tl-item .tx{min-width:0;}

  .meta{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;
    border-top:1px solid var(--border);padding-top:10px;}
  .meta span{display:inline-flex;align-items:center;gap:5px;}
  .meta .ic{font-size:13px;}

  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:90px 20px;}
  .empty .ic{font-size:44px;color:var(--faint);margin-bottom:14px;}
  .empty p{font-size:15px;line-height:1.6;}

  /* ===== Modo presentación ===== */
  body.presenta .grid{grid-template-columns:repeat(auto-fill,minmax(460px,1fr));}
  body.presenta .slug,body.presenta .meta,body.presenta .prompt{display:none;}
  body.presenta .proj{font-size:21px;}
  body.presenta .now{font-size:17px;padding:16px 18px;}
  body.presenta .tl-item{font-size:14.5px;}
  body.presenta .card{padding:24px 26px;gap:15px;}
  body.presenta .badge{font-size:13px;}

  footer{text-align:center;color:var(--faint);font-size:11.5px;padding:10px 0 26px;}

  @media (max-width:560px){
    header{flex-wrap:wrap;gap:12px;padding:14px 16px;}
    .stats{order:3;width:100%;justify-content:space-between;}
    .grid{padding:16px;grid-template-columns:1fr;}
    .title p{display:none;}
  }
</style>
</head>
<body>
<header>
  <div class="brandmark">
    <img src="logo.png" alt="Xentris Tech" onerror="this.outerHTML='<strong style=&quot;font-size:20px;letter-spacing:.5px;color:var(--lila)&quot;>XENTRIS</strong>'">
    <span class="sep" aria-hidden="true"></span>
    <div class="title">
      <h1>Mission Control</h1>
      <p>Orquestador de agentes en tiempo real</p>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="stats" role="group" aria-label="Resumen de sesiones">
    <div class="stat working"><b id="st-working" class="tnum">0</b><span>Trabajando</span></div>
    <div class="stat waiting"><b id="st-waiting" class="tnum">0</b><span>Esperando</span></div>
    <div class="stat"><b id="st-total" class="tnum">0</b><span>Sesiones</span></div>
  </div>
  <button class="toggle" id="btn-presenta" onclick="togglePresenta()" aria-pressed="false">
    <span id="btn-ic" aria-hidden="true"></span><span id="btn-txt">Modo presentación</span>
  </button>
</header>

<main class="grid" id="grid" role="list" aria-label="Sesiones de agentes" aria-live="polite" aria-busy="true">
  <div class="empty"><p>Cargando sesiones…</p></div>
</main>
<footer>Se actualiza cada 4 s · leyendo ~/.claude/projects · solo local (127.0.0.1:7777) · clic en una tarjeta para abrir esa sesión</footer>
<div id="aviso" role="status" aria-live="polite"></div>

<script>
// ---- Iconos SVG (estilo Lucide, sin emojis) ----
const P = {
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  message:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  terminal:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/>',
  cpu:'<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  branch:'<line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
  monitor:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  code:'<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  abrir:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  folder:'<path d="M4 20a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2z"/>',
};
function ic(name){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+(P[name]||'')+'</svg>';}

function ago(sec){
  if(sec<60) return 'hace '+sec+' s';
  if(sec<3600) return 'hace '+Math.round(sec/60)+' min';
  if(sec<86400) return 'hace '+Math.round(sec/3600)+' h';
  return 'hace '+Math.round(sec/86400)+' d';
}
function hora(ts){ if(!ts) return ''; return new Date(ts).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(data){
  const grid=document.getElementById('grid');
  const sessions=data.sessions||[];
  document.getElementById('st-total').textContent=sessions.length;
  document.getElementById('st-working').textContent=sessions.filter(s=>s.status==='working').length;
  document.getElementById('st-waiting').textContent=sessions.filter(s=>s.status==='waiting'||s.status==='paused').length;
  grid.setAttribute('aria-busy','false');

  if(!sessions.length){
    grid.innerHTML='<div class="empty">'+ic('inbox')+'<p>No hay sesiones recientes de Claude Code.<br>Abre una sesión y aparecerá aquí sola.</p></div>';
    return;
  }

  grid.innerHTML=sessions.map(s=>{
    const working=s.status==='working';
    return `
    <article class="card ${esc(s.status)}" role="listitem" tabindex="0"
             data-id="${esc(s.id)}" data-proj="${esc(s.aiTitle||s.projectName)}" data-status="${esc(s.status)}"
             aria-label="Abrir la ventana de ${esc(s.aiTitle||s.projectName)}">
      <div class="card-head">
        <span class="dot" aria-hidden="true"></span>
        <div style="min-width:0">
          <div class="proj">${esc(s.aiTitle||s.projectName)}</div>
          <div class="slug">
            <span class="proyecto"${s.resumen?' data-resumen tabindex="0"':''}>
              ${ic('folder')}${esc(s.projectName)}
              ${s.resumen?`<span class="pastilla" role="tooltip"
                ><span class="p-et">De qué va este proyecto</span>${esc(s.resumen.texto)}<span
                class="p-fuente">${ic('file')}${esc(s.resumen.fuente)}</span></span>`:''}
            </span>
            ${s.subagents?ic('branch')+' subagentes':''}
          </div>
        </div>
        <span class="badge">${esc(s.statusLabel)} · ${ago(s.idleSeconds)}</span>
      </div>
      <div class="now">
        <div class="label">${working?ic('activity')+' Ahora mismo':ic('message')+' Último avance'}</div>
        ${esc(s.nowDoing)}
      </div>
      ${s.lastUserPrompt?`<div class="prompt"><b>Instrucción:</b> ${esc(s.lastUserPrompt)}</div>`:''}
      ${s.timeline.length?`<div class="timeline">${s.timeline.map(t=>
        `<div class="tl-item"><span class="t mono tnum">${hora(t.ts)}</span><span class="tx">${esc(t.text)}</span></div>`).join('')}</div>`:''}
      ${(s.artefactos&&s.artefactos.length)?`<div class="artefactos">${s.artefactos.map(a=>
        `<a class="chip" href="${esc(a.url)}" target="_blank" rel="noopener"
            title="${esc(a.descripcion||a.url)}"
          >${a.favicon?`<span class="emo">${esc(a.favicon)}</span>`:ic('abrir')}<span class="tx"
          >${esc(a.descripcion||'Artefacto publicado')}</span>${ic('abrir')}</a>`).join('')}</div>`:''}
      <div class="meta">
        <span>${ic('terminal')}<span class="tnum">${s.toolCount}</span> acciones</span>
        ${s.model?`<span>${ic('cpu')}${esc(s.model)}</span>`:''}
        <span>${ic('file')}<span class="tnum">${s.sizeKB}</span> KB</span>
      </div>
      <div class="abrir">${ic('abrir')} Clic para abrir esta sesión</div>
    </article>`;
  }).join('');
}

async function refresh(){
  try{ const r=await fetch('/api/sessions'); render(await r.json()); }catch(e){}
}

// ---- Abrir la ventana del agente ----
// Un clic en la tarjeta abre una terminal en la carpeta de esa sesión y retoma
// la conversación con `claude --resume`. El servidor solo acepta ids que existan
// en el disco: la carpeta sale del transcript, nunca del navegador.

let avisoTimer;
function aviso(texto, mal){
  const el=document.getElementById('aviso');
  el.textContent=texto;
  el.classList.toggle('mal',!!mal);
  el.classList.add('ver');
  clearTimeout(avisoTimer);
  avisoTimer=setTimeout(()=>el.classList.remove('ver'),mal?7000:4200);
}

function pedir(id,soloEnfocar){
  return fetch('/api/abrir',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Mission-Control':'1'},
    body:JSON.stringify({id,soloEnfocar})
  }).then(r=>r.json());
}

async function abrirSesion(card){
  if(document.body.classList.contains('presenta')) return;   // solo lectura ante clientes
  const id=card.dataset.id, proj=card.dataset.proj;
  try{
    // Primero intentamos traer al frente la ventana que ya existe. Solo si no
    // hay ninguna se abre una nueva — y si la sesión está trabajando, se
    // pregunta antes, porque duplicarla enreda el hilo.
    aviso('Buscando la ventana de "'+proj+'"…');
    let d=await pedir(id,true);
    if(d.ok&&d.accion==='enfocada'){
      aviso(d.varias
        ? 'Ventana traída al frente. Ojo: hay más de una con ese mismo nombre.'
        : 'Ya estaba abierta — la traje al frente.');
      return;
    }
    if(!d.ok){ aviso('No se pudo: '+(d.error||'error desconocido'),true); return; }

    if(card.dataset.status==='working'){
      if(!confirm('"'+proj+'" está trabajando ahora mismo, pero no encontré su ventana abierta.\n\n'
        +'Abrir una nueva crearía una segunda vista sobre la misma conversación.\n¿Abrirla de todos modos?')) {
        aviso('No se abrió nada.');
        return;
      }
    }
    aviso('Abriendo '+proj+'…');
    d=await pedir(id,false);
    if(d.ok) aviso('Ventana nueva abierta en '+d.cwd);
    else aviso('No se pudo abrir: '+(d.error||'error desconocido'),true);
  }catch(e){ aviso('No se pudo hablar con el servidor de Mission Control.',true); }
}

// Delegación: las tarjetas se repintan cada 4 s, así que el listener va en el grid.
document.getElementById('grid').addEventListener('click',e=>{
  // Un clic en el enlace de un artefacto abre el artefacto, no la sesión.
  if(e.target.closest('a')) { e.stopPropagation(); return; }
  const card=e.target.closest('.card');
  if(card) abrirSesion(card);
});
document.getElementById('grid').addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  const card=e.target.closest('.card');
  if(card){ e.preventDefault(); abrirSesion(card); }
});

function togglePresenta(){
  const on=document.body.classList.toggle('presenta');
  const btn=document.getElementById('btn-presenta');
  btn.classList.toggle('on',on);
  btn.setAttribute('aria-pressed',on?'true':'false');
  document.getElementById('btn-ic').innerHTML=on?ic('code'):ic('monitor');
  document.getElementById('btn-txt').textContent=on?'Modo técnico':'Modo presentación';
  localStorage.setItem('mc-presenta',on?'1':'0');
}

// init
document.getElementById('btn-ic').innerHTML=ic('monitor');
if(localStorage.getItem('mc-presenta')==='1') togglePresenta();
refresh();
setInterval(refresh,4000);
</script>
</body>
